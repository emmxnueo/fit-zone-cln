name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitzone
          POSTGRES_PASSWORD: fitzone
          POSTGRES_DB: fitzone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitzone"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fitzone:fitzone@localhost:5432/fitzone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pruebas con cobertura mínima de 80%
        run: pytest --cov-fail-under=80
